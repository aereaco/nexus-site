<!-- Floating Side Hover Expanding Tab | Breadcrumbs & Page Tabs Toggle (when floatingBookmarks is true) -->
<div data-show="floatingBookmarks" class="absolute end-0 z-40 transition-[max-width,width] duration-300 select-none"
  data-signal="{
    hovered: false,
    dragging: false,
    startY: 0,
    startTop: 0,
    bookmarkTop: Number(localStorage.bookmarkTop || 24),
    onPointerDown: function(e) {
      if (e.button !== 0) return;
      dragging = true;
      hovered = false;
      startY = e.clientY;
      startTop = bookmarkTop;
      e.currentTarget.setPointerCapture(e.pointerId);
    },
    onPointerMove: function(e) {
      if (!dragging) return;
      const bookmarkEl = e.currentTarget.closest('[data-show=\'floatingBookmarks\']');
      const container = (bookmarkEl && bookmarkEl.offsetParent) || document.body;
      const containerRect = container.getBoundingClientRect();
      const maxTop = Math.max(8, containerRect.height - 48);
      const newTop = Math.max(8, Math.min(maxTop, Math.round(startTop + (e.clientY - startY))));
      bookmarkTop = newTop;
      localStorage.setItem('bookmarkTop', String(newTop));
    },
    onPointerUp: function(e) {
      if (dragging) {
        dragging = false;
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch(err) {}
      }
    },
    clampPosition: function() {
      const bookmarkEl = $el.closest ? $el.closest('[data-show=\'floatingBookmarks\']') : null;
      const container = (bookmarkEl && bookmarkEl.offsetParent) || document.body;
      const maxTop = Math.max(8, container.clientHeight - 48);
      if (bookmarkTop > maxTop) {
        bookmarkTop = maxTop;
        localStorage.setItem('bookmarkTop', String(maxTop));
      }
    }
  }"
  data-style="{ top: bookmarkTop + 'px' }"
  data-on-resize_window="clampPosition()"
  data-effect="if (typeof sidebarOpen !== 'undefined' || typeof terminalOpen !== 'undefined') { clampPosition(); }"
  data-on-mouseleave="hovered = false">
  <nav aria-label="Breadcrumb"
    class="flex items-center overflow-hidden rounded-ss-lg rounded-es-lg border border-base-content/10 bg-base-100 text-base-content transition-[max-width,width] duration-300 ease-in-out whitespace-nowrap shadow-sm"
    data-class="{ 'max-w-md w-auto shadow-2xl': hovered, 'max-w-14 w-14': !hovered }">

    <!-- Anchored Drag Handle / Icon (Vertical drag only, no hover expansion) -->
    <div class="flex items-center justify-center h-10 ps-2.5 pe-0.5 shrink-0 bg-secondary text-secondary-content cursor-ns-resize touch-none select-none"
      title="Drag vertically to reposition"
      data-on-pointerdown="onPointerDown($evt)"
      data-on-pointermove="onPointerMove($evt)"
      data-on-pointerup="onPointerUp($evt)"
      data-on-pointercancel="onPointerUp($evt)"
      data-on-mouseenter="hovered = false">
      <iconify-icon icon="material-symbols-light:drag-indicator" class="text-base opacity-70 pointer-events-none"></iconify-icon>
    </div>

    <!-- Surface Area: Bookmark Icon & Breadcrumbs (Hover to expand, no dragging, standard cursor) -->
    <div class="flex items-center h-10 ps-0.5 pe-2.5 gap-1 shrink-0 bg-secondary text-secondary-content cursor-default select-none"
      data-on-mouseenter_delay.150ms="if (!dragging) hovered = true">
      <iconify-icon icon="material-symbols-light:bookmark-outline" class="text-xl"></iconify-icon>
      <!-- Breadcrumbs: Fades & Expands on hover -->
      <div
        class="breadcrumbs text-sm font-semibold max-w-xs overflow-x-auto scrollbar-none transition-all duration-300 flex items-center shrink-0 w-auto"
        data-class="{ 'opacity-100 max-w-xs px-4': hovered, 'opacity-0 max-w-0 px-0': !hovered }">
        <ul class="flex items-center flex-nowrap whitespace-nowrap min-w-max my-0 py-0">
          <template data-for="crumb in router.lineage">
            <li class="flex items-center gap-1 shrink-0">
              <a data-bind-href="crumb.href" class="flex items-center gap-1">
                <iconify-icon data-show="crumb.icon" data-bind-icon="crumb.icon" class="text-base"></iconify-icon>
                <span data-bind="crumb.title"></span>
              </a>
            </li>
          </template>
        </ul>
      </div>
    </div>

    <!-- Toggle End Dock: Fades & Expands on hover -->
    <div class="relative flex items-center h-10 shrink-0 transition-opacity duration-300"
      data-class="{ 'opacity-100 flex': hovered, 'opacity-0 hidden': !hovered }">
      <span
        class="absolute inset-y-0 -start-px h-10 w-4 bg-secondary [clip-path:_polygon(0_0,_0%_100%,_100%_50%)] rtl:rotate-180">
      </span>
      <div class="flex items-center h-10 pe-4 ps-6 bg-base-300 text-secondary">
        <div class="tooltip z-100" data-tip="Toggle page tabs">
          <button class="btn btn-sm btn-ghost btn-circle"
            data-class="{ 'btn-active text-primary bg-primary/10': pageTabs }"
            data-on-mouseenter_debounce.2000ms="pageTabToggleHovered = true"
            data-on-mouseleave_debounce.cancel="pageTabToggleHovered = false"
            data-on-click="pageTabs = !pageTabs; localStorage.setItem('pageTabs', pageTabs)">
            <iconify-icon icon="material-symbols-light:tab-group-outline" class="text-xl"></iconify-icon>
          </button>
        </div>
      </div>
    </div>
  </nav>
</div>
